services:
  db:
    image: postgres:16-alpine
    environment: { POSTGRES_DB: studysync, POSTGRES_USER: studysync, POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-change-me}" }
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U studysync"], interval: 5s, retries: 10 }
  redis:
    image: redis:7-alpine
  web:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgres://studysync:${POSTGRES_PASSWORD:-change-me}@db:5432/studysync
      REDIS_URL: redis://redis:6379/1
    depends_on: { db: { condition: service_healthy }, redis: { condition: service_started } }
    ports: ["8000:8000"]
    volumes: [media:/app/media]
  reminders:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgres://studysync:${POSTGRES_PASSWORD:-change-me}@db:5432/studysync
    depends_on: [web]
    command: sh -c "while true; do python manage.py send_reminders; sleep 3600; done"
volumes: { pgdata: {}, media: {} }
