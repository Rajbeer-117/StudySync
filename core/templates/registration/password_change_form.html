{% extends 'core/base.html' %}
{% block title %}Change password{% endblock %}
{% block content %}
<section class="container auth auth-single"><div class="auth-card glass reveal">
  <span class="feature-ico">{% include 'core/_icon.html' with name='lock' %}</span><h2>Change your password</h2>
  <form method="post" class="stack">{% csrf_token %}
    {% for field in form %}<label class="field"><span>{{ field.label }}</span>{{ field }}{% for e in field.errors %}<em class="field-error">{{ e }}</em>{% endfor %}</label>{% endfor %}
    <button class="btn btn-primary btn-block" type="submit">Update password {% include 'core/_icon.html' with name='check' %}</button>
  </form>
  <p class="auth-links"><a href="{% url 'profile' %}">Back to profile</a></p>
</div></section>
{% endblock %}
